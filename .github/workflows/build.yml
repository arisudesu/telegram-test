name: Build

on:
  workflow_dispatch:
  push:
    tags: [ v* ]

jobs:
  build:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: "Free Disk Space"
        uses: jlumbroso/free-disk-space@v1.3.1

      - name: "Prepare repository"
        uses: actions/checkout@v6

      - name: "Run build"
        run: |
          wget -nv -O source.tar.gz "https://github.com/DrKLO/Telegram/archive/$(cat base.txt).tar.gz"
          tar xf source.tar.gz
          mv -T Telegram-* Telegram

          for p in patches/*.patch; do
            echo "$p"
            git apply --directory Telegram -p 1 "$p"
          done

          wget -nv -O Telegram/keystore.jks --header "Authorization: token ${{ secrets.RELEASE_STORE_REPO_PAT }}" 'https://raw.githubusercontent.com/arisudesu/android-keystores/master/dev.arisu.telegram.jks'

          version_name=$(
            version='${{ github.ref_name }}'
            echo "${version#v}"
          )
          version_code=$(
            set -- $(echo "$version_name" | tr '.' ' ')
            echo $(( $1*1000000 + $2*10000 + $3*100 + $4 ))
          )

          echo "APP_VERSION_NAME=$version_name"
          echo "APP_VERSION_CODE=$version_code"

          sed -i Telegram/gradle.properties -e '
            s/^\(APP_VERSION_NAME=\).*$/\1'$version_name'/
            s/^\(APP_VERSION_CODE=\).*$/\1'$version_code'/
          '

          cd Telegram
          docker build -t telegram-builder .
          docker run --rm -v "$(pwd):/home/source" \
              -e ORG_GRADLE_PROJECT_RELEASE_KEYSTORE_FILE=keystore.jks \
              -e ORG_GRADLE_PROJECT_RELEASE_KEYSTORE_PASSWORD="${{ secrets.RELEASE_STORE_PASSWORD }}" \
              -e ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS=dev.arisu.telegram \
              -e ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD="${{ secrets.RELEASE_KEY_PASSWORD }}" \
              -e ORG_GRADLE_PROJECT_TELEGRAM_APP_ID="${{ secrets.TELEGRAM_APP_ID }}" \
              -e ORG_GRADLE_PROJECT_TELEGRAM_APP_HASH="${{ secrets.TELEGRAM_APP_HASH }}" \
            telegram-builder
          cd ..

          cp Telegram/TMessagesProj/build/outputs/apk/afat/release/app.apk Telegram-${{ github.ref_name }}.apk

      - name: "Create release for tag"
        uses: softprops/action-gh-release@v3
        with:
          files: |
            Telegram-${{ github.ref_name }}.apk
