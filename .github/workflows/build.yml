name: Build

on:
  workflow_dispatch:
  push:
    tags: [ v* ]

jobs:
  build:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: "Free Disk Space"
        uses: jlumbroso/free-disk-space@v1.3.1

      - name: "Prepare repository"
        uses: actions/checkout@v4

      - name: "Run build"
        run: |
          wget -nv -O source.tar.gz 'https://github.com/DrKLO/Telegram/archive/'$(cat base.txt)'.tar.gz'
          tar xf source.tar.gz
          mv -T Telegram-* Telegram

          for p in *.patch; do
            patch -d Telegram -p1 < "$p"
          done

          APP_VERSION_CODE=$(
            version='${{ github.ref_name }}'
            set -- $(echo "${version#v}" | tr '.' ' ')
            echo $(( $1*1000000 + $2*10000 + $3*100 + $4 ))
          )
          echo "APP_VERSION_CODE=$APP_VERSION_CODE"
          echo "APP_VERSION_NAME=$APP_VERSION_NAME"
          sed -i Telegram/gradle.properties -e '
            s/^\(APP_VERSION_CODE=\).*$/\1'$APP_VERSION_CODE'/
            s/^\(APP_VERSION_NAME=\).*$/\1'$APP_VERSION_NAME'/
          '

          cd Telegram
          docker build -t telegram-builder .
          docker run --rm -v "$(pwd):/home/source" telegram-builder
          cd ..

          cp Telegram/TMessagesProj/build/outputs/apk/afat/release/app.apk Telegram-${{ github.ref_name }}.apk

      - name: "Create release for tag"
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Telegram-${{ github.ref_name }}.apk
