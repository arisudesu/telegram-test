name: Check

on:
  workflow_dispatch:
  schedule:
    - cron: 0 3,15 * * *

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: "Prepare master"
        uses: actions/checkout@v6

      - name: "Run check"
        id: check
        run: |
          GRAPHQL_QUERY='{
            repository(owner: "DrKLO", name: "Telegram") {
              object(expression: "master") {
                ... on Commit {
                  file(path: "gradle.properties") { object { ... on Blob { text } } }
                  blame(path: "gradle.properties") { ranges { startingLine endingLine commit { oid } } }
                }
              }
            }
          }'

          GRAPHQL_INFO=$(curl -s 'https://api.github.com/graphql' -H 'Authorization: bearer ${{ secrets.GITHUB_TOKEN }}' -d "$(echo "$GRAPHQL_QUERY" | jq -Rs '{query: .}')")

          APP_VERSION_LINE=$(echo "$GRAPHQL_INFO" | jq -r '.data.repository.object.file.object.text' | grep -n '^APP_VERSION_NAME=')
          APP_VERSION_NAME=${APP_VERSION_LINE##*=}
          APP_VERSION_LNUM=${APP_VERSION_LINE%%:*}
          APP_VERSION_REV=$(echo "$GRAPHQL_INFO" | jq -r '.data.repository.object.blame.ranges[] | select(.startingLine <= '"$APP_VERSION_LNUM"' and '"$APP_VERSION_LNUM"' <= .endingLine) | .commit.oid')
          echo "Version in master: v$APP_VERSION_NAME, from revision: $APP_VERSION_REV"

          MY_RELEASE_TAG=$(curl -s 'https://api.github.com/repos/${{ github.repository }}/releases/latest' | jq -r '.tag_name')
          echo "My release tag: $MY_RELEASE_TAG"

          THEIRS=v$APP_VERSION_NAME
          MY=${MY_RELEASE_TAG%.*}

          echo "My version: $MY, theirs: $THEIRS"

          [ "$THEIRS" = "$MY" ] && exit 0

          NEW_TAG=${THEIRS}.0

          echo "$APP_VERSION_REV" > base.txt
          git add base.txt

          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git commit --allow-empty -m "Trigger release of $NEW_TAG"
          git tag "$NEW_TAG"
          git push --atomic origin master "$NEW_TAG"

          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

      - name: "Run build workflow"
        if: steps.check.outputs.tag
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: build.yml
          ref: refs/tags/${{ steps.check.outputs.tag }}
